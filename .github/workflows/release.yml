name: Release

# Commits go to main continuously (each one tested by the CI workflow), but a release
# ("VEDA 0.2.0 build N", built for Windows, macOS and Linux) is published only about once
# a month: every Monday the "decide" job checks that main has commits since the latest
# release, that the latest release is at least RELEASE_MIN_DAYS old (repository variable,
# default 30) and that CI passed on main's head, and publishes only then.  Running the
# workflow by hand publishes main's head if CI passed on it; a pushed version tag (v1.2.3)
# publishes that version.  Every release is archived on Zenodo with its own DOI, so old
# releases are never deleted.  The app's weekly automatic update picks up a new release.

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read                 # the CI result of the commit to publish

concurrency:
  group: release
  cancel-in-progress: false     # never stop a release half-way: it is archived on publication

jobs:
  decide:
    name: decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      sha: ${{ steps.decide.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MIN_DAYS: ${{ vars.RELEASE_MIN_DAYS || '30' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0          # history and tags: the commits since the latest release
      - id: decide
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          ci_passed() {         # a successful CI run on exactly this commit
            [ "$(gh api "repos/${GH_REPO}/actions/workflows/ci.yml/runs?head_sha=$1&status=success&per_page=1" --jq .total_count)" -gt 0 ]
          }
          publish=false
          case "${GITHUB_EVENT_NAME}" in
            push)
              publish=true
              echo "Version tag ${GITHUB_REF#refs/tags/}: publishing ${sha}." ;;
            workflow_dispatch)
              if ci_passed "$sha"; then publish=true; echo "Run by hand: publishing main at ${sha} (CI passed on it)."
              else echo "Run by hand, but CI has not passed on main's head ${sha}: not publishing."; fi ;;
            schedule)
              latest=$(gh release view --json tagName,publishedAt --jq '.tagName + " " + .publishedAt' 2>/dev/null || true)
              if [ -z "$latest" ]; then
                tag=""; age_days=999999; new=$(git rev-list --count HEAD)
              else
                tag=${latest%% *}
                age_days=$(( ( $(date -u +%s) - $(date -u -d "${latest#* }" +%s) ) / 86400 ))
                if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
                  new=$(git rev-list --count "${tag}..HEAD")
                else
                  new=1               # (the latest release's tag is not in this clone: assume changes)
                fi
              fi
              echo "Latest release: ${tag:-none}, ${age_days} days old; ${new} commits on main since; minimum gap ${MIN_DAYS} days."
              if [ "$new" -eq 0 ]; then echo "No commits since the latest release: not publishing."
              elif [ "$age_days" -lt "$MIN_DAYS" ]; then echo "The latest release is under ${MIN_DAYS} days old: not publishing."
              elif ! ci_passed "$sha"; then echo "CI has not passed on main's head ${sha}: not publishing."
              else publish=true; echo "Publishing main at ${sha}."; fi ;;
            *)
              echo "Event ${GITHUB_EVENT_NAME}: not publishing." ;;
          esac
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install ".[build]"
      - name: Stamp the build
        shell: bash
        run: |
          cat > src/veda/_build.py <<EOF
          """Written by the release workflow."""
          BUILD = {"number": ${{ github.run_number }}, "commit": "$(git rev-parse --short HEAD)", "date": "$(date -u +%Y-%m-%d)"}
          EOF
      - name: Build
        run: python scripts/build_exe.py --archive
      - name: Check the automatic update's swap on the built app
        # unpacks the zip as an installed copy and a staged update, runs the swap script
        # for this system against them and checks the restart, its options and that the
        # data folder is untouched (scripts/check_update_swap.py)
        shell: bash
        timeout-minutes: 10
        run: python scripts/check_update_swap.py dist/*.zip
      - uses: actions/upload-artifact@v6
        with:
          name: veda-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [decide, build]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 0          # history and tags, for the list of changes
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Name the release
        id: name
        shell: bash
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/veda/__init__.py').read_text()).group(1))")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "title=VEDA ${version}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=VEDA ${version} build ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the release notes
        shell: bash
        run: |
          # The changes since the previous release (the latest published build, or for a
          # version tag the previous version), one line per commit, then where to read more.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            prev=$(git describe --tags --abbrev=0 --exclude '*-build.*' --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          else
            prev=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          fi
          {
            echo "Downloads for Windows (x86_64), macOS (Apple Silicon) and Linux (x86_64) are below: unzip and run, no Python needed (see [Installation](https://github.com/${GH_REPO}/blob/main/README.md#installation)). Your data, downloads and settings are kept in a separate folder, so replacing an older VEDA folder keeps them."
            echo
            if [[ -n "$prev" ]] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null && [[ -n "$(git log --format=%h "$prev..HEAD")" ]]; then
              echo "### Changes since ${prev}"
              echo
              git log --no-merges --format='- %s' "$prev..HEAD"
              echo
              echo "**Full Changelog**: https://github.com/${GH_REPO}/compare/${prev}...${{ steps.name.outputs.tag }}"
            else
              echo "### Latest changes"
              echo
              git log --no-merges --format='- %s' -n 10
            fi
            echo
            echo "All changes in this version, grouped by topic: [CHANGELOG.md](https://github.com/${GH_REPO}/blob/main/CHANGELOG.md)."
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          name: ${{ steps.name.outputs.title }}
          target_commitish: ${{ needs.decide.outputs.sha }}
          files: artifacts/*.zip
          body_path: release-notes.md
          prerelease: false
          make_latest: "true"
