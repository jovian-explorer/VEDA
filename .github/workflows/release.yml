name: Release

# Every push to main whose tests pass (the CI workflow) is built for Windows, macOS
# and Linux and published as the latest release ("VEDA 0.2.0 build 42"), so testers
# always download the newest version and the app can tell them a newer build exists.
# A pushed version tag (v1.2.3) publishes a named version release the same way.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true      # a newer push supersedes a build still running

jobs:
  build:
    name: build (${{ matrix.os }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install ".[build]"
      - name: Stamp the build
        shell: bash
        run: |
          cat > src/veda/_build.py <<EOF
          """Written by the release workflow."""
          BUILD = {"number": ${{ github.run_number }}, "commit": "$(git rev-parse --short HEAD)", "date": "$(date -u +%Y-%m-%d)"}
          EOF
      - name: Build
        run: python scripts/build_exe.py --archive
      - uses: actions/upload-artifact@v6
        with:
          name: veda-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0          # history and tags, for the list of changes
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Name the release
        id: name
        shell: bash
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/veda/__init__.py').read_text()).group(1))")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "title=VEDA ${version}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "title=VEDA ${version} build ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Write the release notes
        shell: bash
        run: |
          # The changes since the previous release (the latest build, or for a version tag
          # the previous version), one line per commit, then where to read more.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            prev=$(git describe --tags --abbrev=0 --exclude '*-build.*' --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          else
            prev=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          fi
          {
            echo "Downloads for Windows (x86_64), macOS (Apple Silicon) and Linux (x86_64) are below: unzip and run, no Python needed (see [Installation](https://github.com/${GH_REPO}/blob/main/README.md#installation)). Your data, downloads and settings are kept in a separate folder, so replacing an older VEDA folder keeps them."
            echo
            if [[ -n "$prev" ]] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null && [[ -n "$(git log --format=%h "$prev..HEAD")" ]]; then
              echo "### Changes since ${prev}"
              echo
              git log --no-merges --format='- %s' "$prev..HEAD"
              echo
              echo "**Full Changelog**: https://github.com/${GH_REPO}/compare/${prev}...${{ steps.name.outputs.tag }}"
            else
              echo "### Latest changes"
              echo
              git log --no-merges --format='- %s' -n 10
            fi
            echo
            echo "All changes in this version, grouped by topic: [CHANGELOG.md](https://github.com/${GH_REPO}/blob/main/CHANGELOG.md)."
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          name: ${{ steps.name.outputs.title }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          files: artifacts/*.zip
          body_path: release-notes.md
          prerelease: false
          make_latest: "true"
      - name: Keep the 5 newest builds
        shell: bash
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-build\\."))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          # (a run cancelled by a newer push can leave a release whose tag is already gone:
          # failing on it marked a release that had been published as failed)
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag || echo "::warning::could not delete $tag"; done
